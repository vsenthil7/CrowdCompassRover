# Cloud Build: build, push, and deploy the backend image to Cloud Run.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/crowdcompass-rover-backend:$SHORT_SHA",
           "-f", "backend/Dockerfile", "backend/"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/crowdcompass-rover-backend:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - crowdcompass-rover
      - --image=gcr.io/$PROJECT_ID/crowdcompass-rover-backend:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --port=8000
images:
  - gcr.io/$PROJECT_ID/crowdcompass-rover-backend:$SHORT_SHA
