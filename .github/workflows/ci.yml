name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run live Elastic/Gemini integration tests (needs secrets)"
        required: false
        default: "false"
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend (dev)
        run: cd backend && pip install -e ".[dev]"
      - name: Ruff lint (non-blocking)
        run: cd backend && pip install ruff && ruff check app/ tests/ || true
      - name: pip-audit CVE check (non-blocking)
        run: cd backend && pip install pip-audit && pip-audit || true

  backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend
        run: cd backend && pip install -e ".[dev]"
      - name: Test (100% coverage gate)
        run: cd backend && pytest
      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/

  frontend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Type-check & build
        run: cd frontend && npm run build
      - name: Test (coverage)
        run: cd frontend && npx vitest run --coverage

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backend
        run: cd backend && pip install -e ".[dev]"
      - name: Install e2e
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Run journeys
        run: cd e2e && npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t crowdcompass-rover-backend:ci backend/
      - name: Smoke-test backend container (mock mode)
        run: |
          docker run -d --rm -e APP_MODE=mock -p 8000:8000 --name rover-ci crowdcompass-rover-backend:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/health >/dev/null; then echo healthy; break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/api/health | python3 -c "import sys,json; assert json.load(sys.stdin)['status']=='ok'"
          docker stop rover-ci
      - name: Build frontend image
        run: docker build -t crowdcompass-rover-frontend:ci frontend/

  sbom:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate CycloneDX SBOM
        run: |
          cd backend && pip install -e "." cyclonedx-bom
          cyclonedx-py environment --output-format json --outfile sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: backend/sbom.cdx.json

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration == 'true'
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend
        run: cd backend && pip install -e ".[dev]"
      - name: Live Elastic + Gemini integration
        env:
          APP_MODE: real
          ELASTIC_MCP_URL: ${{ secrets.ELASTIC_MCP_URL }}
          ELASTIC_MCP_API_KEY: ${{ secrets.ELASTIC_MCP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cd backend && pytest tests/integration -o addopts="" -m integration -v
