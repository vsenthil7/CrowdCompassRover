[project]
name = "crowdcompass-rover-backend"
version = "1.0.0"
description = "CrowdCompass Rover — multilingual semantic city/event agent over Elastic + Gemini"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.5",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "cyclonedx-bom>=4.4",
    "pip-audit>=2.7",
    "python-jose[cryptography]>=3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=100 -q -m \"not integration\""
markers = [
    "integration: live-service tests (Elastic/Gemini/GCP/Redis); skipped unless credentials are set",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/mcp/mock_server.py", "app/data/seed.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
