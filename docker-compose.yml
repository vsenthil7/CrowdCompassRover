# docker-compose.yml — CrowdCompass Rover full stack.
#
# Default (`docker compose up`): backend in mock mode + frontend. Zero credentials,
# nothing external required — mirrors the zero-config local/dev experience.
#
# Live stack (`docker compose --profile live up`): additionally starts Elasticsearch
# and Redis and runs the backend in hybrid mode against them. Provide ELASTIC/GEMINI
# credentials via a .env file when you want the real integrations.

services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      - APP_MODE=${APP_MODE:-mock}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # ---- Live integrations (opt in with: docker compose --profile live up) ----
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    profiles: ["live"]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.2-alpine
    profiles: ["live"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend wired to the live services; only runs under the "live" profile.
  backend-live:
    build:
      context: backend
      dockerfile: Dockerfile
    profiles: ["live"]
    environment:
      - APP_MODE=hybrid
      - ELASTIC_MCP_URL=${ELASTIC_MCP_URL:-http://elasticsearch:9200}
      - ELASTIC_MCP_API_KEY=${ELASTIC_MCP_API_KEY:-}
      - ELASTIC_INDEX=${ELASTIC_INDEX:-cc-city-events}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  es-data:
